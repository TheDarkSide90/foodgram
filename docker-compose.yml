version: '3.3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:14
    env_file: .env
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: thedarkside90/foodgram_backend
    env_file: .env
    restart: always
    depends_on:
      - db
    volumes:
      - static:/app/staticfiles
      - media:/app/media

  frontend:
    image: thedarkside90/foodgram_frontend
    depends_on:
      - db
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static

  gateway:
    image: nginx:1.25.4-alpine
    env_file: .env
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - 8080:80
    volumes:
      - static:/usr/share/nginx/html
      - media:/media
