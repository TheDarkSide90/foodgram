version: '3.3'

volumes:
  pg_data:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:14
    env_file: .env
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: thedarkside90/foodgram_backend
    env_file: .env
    restart: always
    depends_on:
      - db
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  frontend:
    image: thedarkside90/foodgram_frontend
    depends_on:
      - db
    volumes:
      - static_volume:/frontend_static
    command: sh -c "cp -r /app/build/. /frontend_static/"

  gateway:
    image: nginx:1.25.4-alpine
    env_file: .env
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - 8080:80
    volumes:
      - static_volume:/usr/share/nginx/html
      - media_volume:/media
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf