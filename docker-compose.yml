version: '3.3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:14
    env_file: .env
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: thedarkside90/foodgram_backend
    env_file: .env
    restart: always
    depends_on:
      - db
    volumes:
      - static:/backend_static
      - media:/media

  frontend:
    image: thedarkside90/foodgram_frontend
    depends_on:
      - db
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static

  gateway:
    image: nginx:1.25.4-alpine
    env_file: .env
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - 9500:80
    volumes:
      - static:/static
      - media:/media
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf
