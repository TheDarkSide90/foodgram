version: '3.3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    container_name: foodgram-backend
    image: thedarkside90/foodgram_backend
    env_file: .env
    restart: always
    depends_on:
      - db
    volumes:
      - static:/backend_static
      - media:/media

  frontend:
    container_name: foodgram-front
    image: thedarkside90/kittygram_frontend
    volumes:
      - static:/frontend_static

  gateway:
    image: thedarkside90/foodgram_gateway
    env_file: .env
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - 10000:80
    volumes:
      - static:/static
      - media:/media